services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: evil_twin
      MARIADB_USER: evil_twin
      MARIADB_PASSWORD: evil_twin_pass
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  dashboard:
    build:
      context: .
      args:
        CONTEXT_PATH: ${CONTEXT_PATH:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: evil_twin
      DB_USER: evil_twin
      DB_PASS: evil_twin_pass
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: CHANGE_ME
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
